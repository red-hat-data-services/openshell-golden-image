# Build inputs for Containerfile.saw-disk-image (multi-arch: amd64 + arm64)
#
# Wraps the qcow2 produced by the saw-qcow2-disk-image (amd64) and
# saw-qcow2-disk-image-aarch64 (arm64) components. Each platform build
# selects its own artifact inside Containerfile.saw-disk-image, so the
# component is one multi-arch manifest list — consumers pin a single
# digest. The pre-fetch-disk-image task reads these values; they are updated
# by Konflux nudge MRs from the qcow2 components, not by Renovate.
OCI_ARTIFACT_AMD64=quay.io/redhat-user-workloads/ai-incubator-tenant/saw-golden-image/saw-qcow2-disk-image@sha256:1616ba05dccd5deb10f716cfcd844930544d69da3c1ad4ba7ba5c029fdfe8055
OCI_ARTIFACT_ARM64=quay.io/redhat-user-workloads/ai-incubator-tenant/saw-golden-image/saw-qcow2-disk-image-aarch64@sha256:e5ab37d8b3a4308f61ca1f89040207b507c182c510d11d76c94fc3ccbccd9a27
# The qcow2 artifacts are pulled before the build by the pre-fetch-disk-image
# task of pipelines/disk-image-container-hermetic.yaml, using the
# registry-auth workspace (components-namespace-pull).
SAW_VERSION_ID=0.1.0
