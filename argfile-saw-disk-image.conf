# Build inputs for Containerfile.saw-disk-image (multi-arch: amd64 + arm64)
#
# Wraps the qcow2 produced by the saw-qcow2-disk-image (amd64) and
# saw-qcow2-disk-image-aarch64 (arm64) components. Each platform build
# selects its own artifact inside Containerfile.saw-disk-image, so the
# component is one multi-arch manifest list — consumers pin a single
# digest. The digests stay PLACEHOLDERs until the first build-vm-image
# runs publish the artifacts; they are then updated by Konflux nudge MRs
# from the qcow2 components, not by Renovate.
OCI_ARTIFACT_AMD64=quay.io/redhat-user-workloads/ai-incubator-tenant/saw-golden-image/saw-qcow2-disk-image@sha256:467b7aa648a21887e22588ac9489f198ae80e11d48dd35c82edda0e56aea176f
OCI_ARTIFACT_ARM64=quay.io/redhat-user-workloads/ai-incubator-tenant/saw-golden-image/saw-qcow2-disk-image-aarch64@sha256:b23941a9eedba5d28ca4df37fcecca1fcece774466ee96477a484f8017c308a2
# The extract image comes from registry.access.redhat.com (anonymous pull):
# the build mounts only the quay artifact-pull secret, which does not
# authenticate to registry.redhat.io — verified on the build cluster.
OCI_EXTRACT_IMAGE=registry.access.redhat.com/ubi9/ubi:9.8-1792742206
ORAS_VERSION=1.2.2
# The task's additional-build-secret provides components-namespace-pull
# (tenant-registry-scoped): it can pull both arch's qcow2 artifacts, which
# the per-repo robots cannot. The name here must match that param.
IMAGE_PULL_SECRET=components-namespace-pull
SAW_VERSION_ID=0.1.0
