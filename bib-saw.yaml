# BIB: Bootc Image Builder Config
#
# Produces the SAW qcow2 from the bootc container via the Konflux
# build-vm-image task (pattern: konflux-data pipelines/disk-image.yaml).
#
# source-image is the multi-arch saw-bootc image index: one digest serves
# both arch legs (bootc-image-builder resolves the index per build
# platform), same shape as the RHEL AI bibs. The digest is updated by
# Konflux nudge MRs from the saw-bootc component (build-nudge-files
# covers *.yaml), not by Renovate.
bootc-builder-image: "quay.io/centos-bootc/bootc-image-builder:latest@sha256:4d8a0d9d173a9f450ff42d70777e1e0a6681a68f5c0f5084b65222eceb1f4d05"
source-image: "quay.io/redhat-user-workloads/ai-incubator-tenant/saw-golden-image/saw-bootc@sha256:08698f0ea2f6d8368c7e40e24606a18f753384493e94a728c70a5b0b638bd192"
tagged-as: "quay.io/redhat-user-workloads/ai-incubator-tenant/saw-golden-image/saw-qcow2-disk-image:0.1.3.rhaiv.1-2.el9ai-b3d4761"
