# Build inputs for Containerfile.saw
# RHEL 9 EUS bootc base. The EUS minor tracks RHAI-10799: 9.8 since
# issue #24. The minor appears in exactly two places — this file and
# repos/rhel-9.8-eus.repo — so grep for the previous minor when moving.
# RPM content is hermetic: rpms.in.yaml / rpms.lock.yaml pin every package
# (including the openshell-* RPMs from the RHEL AI layered el9 repo); the
# activation key is only used by the prefetch task.
BASE_IMAGE=registry.redhat.io/rhel9-eus/rhel-9.8-bootc:9.8-1793759882
VENDOR=Red Hat, Inc.
SAW_VERSION_ID=0.1.0
