# Build inputs for Containerfile.saw
# RHEL 9 EUS bootc base (decision 2026-10-22), pattern-consistent with the
# RHEL AI pin. Entitled repos come from rhel-ai-activation-key (pinned to
# release 9.6, correct for this base — no re-pin needed).
BASE_IMAGE=registry.redhat.io/rhel9-eus/rhel-9.6-bootc:9.6-1792649715
VENDOR=Red Hat, Inc.
SAW_VERSION_ID=0.1.0
# OpenShell RPMs: layered rhelai el9 repo on the entitled CDN, both arches
# via $basearch. To verify on the first Konflux build: that the activation
# key's org entitlement covers the layered rhelai content and that the
# x86_64 tree carries the same el9ai builds as the aarch64 one.
OPENSHELL_REPO_URL=https://cdn.redhat.com/content/dist/layered/rhel9/$basearch/rhelai/3.6/os/
OPENSHELL_VERSION=0.1.3.rhaiv.1-2.el9ai
